version: 2.1

jobs:
  build:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:7.0  # .NET 7 SDK
      - image: cimg/node:18.16  # Node.js 18 with npm
    steps:
      - checkout
      - run:
          name: Restore NuGet Packages
          command: dotnet restore ImgStorgeASP.sln
      - run:
          name: Publish Application
          command: |
            ENV_CONFIG_NAME=$(if [ "${CIRCLE_BRANCH}" = "main" ]; then echo "Release"; else echo "Debug"; fi)
            dotnet publish ImgStorgeASP.sln --configuration ${ENV_CONFIG_NAME} --output ImgStorageOutput
      - run:
          name: Create Deployment Package
          command: |
            cd ImgStorageOutput
            zip -r imgstorageasp.zip *
            cd ..
      - run:
          name: Install CodeSec CLI
          command: npm install -g @contrast/contrast
      - run:
          name: Authenticate CodeSec CLI
          command: |
            contrast auth --api-key YOUR_API_KEY \
              --authorization YOUR_AUTHORIZATION \
              --organization-id YOUR_ORG_ID \
              --host https://ce.contrastsecurity.com
      - run:
          name: Perform SAST Scan
          command: contrast scan --file ImgStorageOutput/imgstorageasp.zip

  notify:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Send Notification
          command: |
            if [ "${CIRCLE_JOB_STATUS}" = "success" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_NOTIFICATION_GROUP_ID}" \
                -d "parse_mode=Markdown" \
                --data-urlencode "text=✅ *Build and Scan Workflow* #${CIRCLE_BUILD_NUM} successfully completed."
            else
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_NOTIFICATION_GROUP_ID}" \
                -d "parse_mode=Markdown" \
                --data-urlencode "text=❌ *Build and Scan Workflow* #${CIRCLE_BUILD_NUM} failed."
            fi

workflows:
  build-and-scan:
    jobs:
      - build
      - notify:
          requires:
            - build
          context:
            - TELEGRAM_BOT_TOKEN
